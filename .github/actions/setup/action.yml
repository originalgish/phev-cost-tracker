name: Set up
description: Install pnpm and Node, and install dependencies from the lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 12.18.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # `wrangler types` takes the secret names for Env from .dev.vars, which is git-ignored.
    - run: cp .dev.vars.example .dev.vars
      shell: bash
