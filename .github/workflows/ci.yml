name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm check:specs

  # Bundles the Worker and validates wrangler.jsonc without deploying.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm exec wrangler deploy --dry-run --outdir dist-check

  # Applies every migration to an empty local D1 database.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm migrate:local

  deploy:
    needs: [test, typecheck, specs, build, migrations]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never cancel a deploy halfway through a migration. A newer push waits its turn.
    concurrency:
      group: deploy
    steps:
      - uses: ./.github/actions/setup
      # The token goes only to the steps that use it, so dependency install scripts never see it.
      - run: pnpm migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # `pnpm deploy` without `run` is pnpm's own command, not this package's script.
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
